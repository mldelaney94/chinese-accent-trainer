[project]
name = "trainer"
version = "0.1.0"
description = "Mandarin accent trainer: CCTV 新闻联播 segments, forced-aligned, with pitch-contour comparison"
readme = "README.md"
authors = [
    { name = "Matthew Delaney", email = "mldelaney94@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # ingest
    "httpx>=0.27",
    "selectolax>=0.3",
    # align (Qwen3-ForcedAligner on Apple Silicon)
    "mlx-audio>=0.2",
    # enrich
    "pypinyin>=0.53",
    # translate (local LLM)
    "mlx-lm>=0.20",
    # pitch
    "praat-parselmouth>=0.4",
    "numpy>=1.26",
    "soundfile>=0.12",
    # app
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "rjieba>=0.2.2",
]

[project.scripts]
trainer = "trainer.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]
